{{define "head"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} · 中英句子练习</title>
  <style>
    :root {
      --bg: #e7e0d4;
      --card: #fffdf8;
      --ink: #1f1a17;
      --muted: #6f675f;
      --line: #e4d9cb;
      --accent: #9c3412;
      --accent-ink: #fff8f4;
      --ok: #1b6b42;
      --ok-bg: #e6f5ec;
      --shadow: 0 18px 40px rgba(70, 46, 24, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 0% -10%, #f7f1e6, transparent 55%),
        var(--bg);
      font-family: "Avenir Next", "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", "WenQuanYi Micro Hei", "Droid Sans Fallback", sans-serif;
      line-height: 1.6;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 28px 20px 48px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 28px; }
    .brand { color: inherit; text-decoration: none; font-weight: 700; letter-spacing: 0.06em; }
    nav { display: flex; gap: 6px; }
    nav a { color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 999px; }
    nav a.active, nav a:hover { color: var(--ink); background: rgba(255, 253, 248, 0.8); }
    .card { background: var(--card); border-radius: 18px; padding: 28px; box-shadow: var(--shadow); margin-bottom: 16px; }
    h1, h2 { font-family: "Iowan Old Style", Palatino, "Songti SC", "Noto Serif SC", "STSong", "SimSun", "WenQuanYi Micro Hei", serif; font-weight: 600; line-height: 1.35; }
    h1 { font-size: 1.9rem; margin: 0 0 8px; }
    h2 { font-size: 1.25rem; margin: 0 0 8px; }
    .sentence { font-size: 2rem; margin: 8px 0 22px; }
    .lede, .meta, .eyebrow { color: var(--muted); }
    .eyebrow { margin: 0; font-size: 0.78rem; letter-spacing: 0.12em; }
    .lede { margin: 0 0 8px; }
    label { display: block; margin: 16px 0 6px; font-size: 0.92rem; }
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      color: inherit;
      background: #fff;
      resize: vertical;
    }
    textarea:focus { outline: 2px solid #e6d9cc; border-color: #8d8378; }
    button, .button {
      display: inline-block;
      margin-top: 18px;
      background: var(--accent);
      color: var(--accent-ink);
      border: 0;
      border-radius: 999px;
      padding: 10px 18px;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    .button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .actions .button, .actions button { margin-top: 0; }
    .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .compare.single { grid-template-columns: 1fr; }
    .compare > div { background: #faf6f1; border-radius: 14px; padding: 14px 16px; min-height: 120px; }
    .compare .reference { box-shadow: inset 3px 0 0 var(--accent); }
    .answer, .zh, .en, .sentence { overflow-wrap: anywhere; }
    .answer { white-space: pre-wrap; margin: 8px 0 0; font-size: 1.05rem; }
    .badge { margin: 14px 0 0; color: var(--muted); }
    .badge.ok { color: var(--ok); }
    .flash { background: var(--ok-bg); color: var(--ok); padding: 8px 12px; border-radius: 10px; }
    .error { color: #9f1239; margin: 12px 0 0; }
    .list { list-style: none; padding: 0; margin: 0; }
    .list li { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
    .zh { margin: 0; }
    .en { margin: 4px 0 0; color: #3d4f63; }
    .row-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .row-actions form { margin: 0; }
    .quiet {
      margin: 0;
      padding: 6px 10px;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
    }
    .link { color: var(--ink); text-decoration: none; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); }
    footer { color: var(--muted); font-size: 0.85rem; margin-top: 8px; }
    ::selection { background: #f3d2c4; }
    @media (max-width: 640px) {
      .compare { grid-template-columns: 1fr; }
      h1 { font-size: 1.6rem; }
      .sentence { font-size: 1.55rem; }
      .list li { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="/">中英句子练习</a>
      <nav>
        <a href="/add" {{if eq .Page "add"}}class="active"{{end}}>添加</a>
        <a href="/practice" {{if eq .Page "practice"}}class="active"{{end}}>练习</a>
      </nav>
    </header>
{{end}}

{{define "foot"}}
    <footer>句子只保存在这台电脑的 SQLite 文件里。</footer>
  </div>
</body>
</html>
{{end}}
